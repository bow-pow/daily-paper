name: Daily Paper Build

on:
  schedule:
    # 07:00 UTC every day. Adjust to your timezone preference.
    - cron: '0 7 * * *'
  workflow_dispatch:   # lets you trigger manually from the Actions tab

permissions:
  contents: write      # needed to commit the generated HTML back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf edge-tts

      - name: Build today's page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build.py

      - name: Rebuild archive index
        run: python scripts/build_archive_index.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ seen.json candidates_cache/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily paper: $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Pull the freshly committed page
        run: git pull --rebase
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
